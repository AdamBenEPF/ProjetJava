<div class="wrapper">
  <mat-card class="card">
    <header class="header">
      <span class="logo" aria-hidden="true">🥗</span>
      <h1>
        <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
        {{ title }}
      </h1>
      @if (subtitle) {
        <p class="subtitle">{{ subtitle }}</p>
      }
    </header>
    <mat-card-content>
      <ng-content></ng-content>
    </mat-card-content>
    <footer class="footer">
      <ng-content select="[footer]"></ng-content>
    </footer>
  </mat-card>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="email" cdkFocusInitial />
    @if (form.controls.email.hasError("required")) {
      <mat-error>L'email est obligatoire.</mat-error>
    } @else if (form.controls.email.hasError("email")) {
      <mat-error>Adresse email invalide.</mat-error>
    }
  </mat-form-field>

  <app-password-field [control]="form.controls.motDePasse"></app-password-field>

  @if (error) {
    <app-error-state class="form-error" [message]="error" [retryable]="false"></app-error-state>
  }

  <button mat-flat-button color="primary" type="submit" class="submit" [disabled]="loading">
    @if (loading) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Se connecter
    }
  </button>
</form>

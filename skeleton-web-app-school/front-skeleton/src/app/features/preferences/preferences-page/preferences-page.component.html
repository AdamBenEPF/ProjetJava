<app-page-header title="Préférences" subtitle="Votre profil et votre régime alimentaire, utilisés pour filtrer les recettes." icon="tune"></app-page-header>

<form [formGroup]="form" (ngSubmit)="save()">
  <app-profile-section class="section" [nameControl]="form.controls.nom" [email]="user()?.email ?? ''"></app-profile-section>

  <mat-card class="section">
    <mat-card-header>
      <mat-card-title>Régime alimentaire</mat-card-title>
      <mat-card-subtitle>Appliqué par défaut aux recettes, au planning et à la génération par l'IA.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <app-diet-selector
        [value]="form.controls.preferenceRegime.value"
        (valueChange)="form.controls.preferenceRegime.setValue($event); form.markAsDirty()"
      ></app-diet-selector>
    </mat-card-content>
  </mat-card>

  <div class="actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="form.pristine || saving()">
      @if (saving()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        <mat-icon>save</mat-icon>
        Enregistrer
      }
    </button>
  </div>
</form>

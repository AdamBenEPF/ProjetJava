<app-page-header title="Planning de la semaine" subtitle="Cliquez sur un créneau pour y assigner une recette." icon="calendar_month">
  <app-export-menu [options]="exportOptions" [disabled]="!plans().length" (exportRequested)="exportPlanning($event)"></app-export-menu>
</app-page-header>

<app-week-navigator></app-week-navigator>

@if (error(); as message) {
  <app-error-state [message]="message" (retry)="reload()"></app-error-state>
} @else if (loading()) {
  <app-loading-state message="Chargement du planning…"></app-loading-state>
} @else {
  <app-week-summary [plans]="plans()"></app-week-summary>
  <app-week-calendar
    [days]="week.days()"
    [plans]="plans()"
    (addMeal)="openPicker($event)"
    (removeMeal)="removeMeal($event)"
    (viewMeal)="viewRecipe($event)"
  ></app-week-calendar>
}

<mat-toolbar class="navbar no-print">
  <a class="brand" routerLink="/">
    <span class="logo" aria-hidden="true">🥗</span>
    <span class="brand-name">Planning Repas</span>
  </a>

  @if (isAuthenticated()) {
    <nav class="links">
      @for (link of links; track link.href) {
        <a mat-button [routerLink]="link.href" routerLinkActive="active">
          <mat-icon>{{ link.icon }}</mat-icon>
          <span class="link-label">{{ link.name }}</span>
        </a>
      }
    </nav>

    <button mat-icon-button class="menu-mobile" [matMenuTriggerFor]="mobileMenu" aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #mobileMenu="matMenu">
      @for (link of links; track link.href) {
        <a mat-menu-item [routerLink]="link.href">
          <mat-icon>{{ link.icon }}</mat-icon>
          <span>{{ link.name }}</span>
        </a>
      }
    </mat-menu>
  }

  <app-user-menu></app-user-menu>
</mat-toolbar>
